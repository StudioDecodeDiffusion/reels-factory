name: TikTok · connexion

# 1er lancement sans code : le résumé du run donne le lien d'autorisation.
# 2e lancement avec le code affiché par la page de retour : la connexion est enregistrée (chiffrée) dans state/.
on:
  workflow_dispatch:
    inputs:
      compte:
        description: "Compte (actu, science, qhse, eco, fun)"
        required: true
        default: "actu"
      code:
        description: "Code affiché après « Autoriser » (laisser vide pour obtenir le lien)"
        required: false

permissions:
  contents: write

jobs:
  connexion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Connexion
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_COMPTE: ${{ inputs.compte }}
          TIKTOK_CODE: ${{ inputs.code }}
        run: |
          if [ -n "$TIKTOK_CODE" ]; then echo "::add-mask::$TIKTOK_CODE"; fi
          python -m pipeline.github_flow tiktok_connexion
      - name: Sauvegarder la mémoire
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "état : connexion TikTok" && for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; sleep $((i*4)); done)
