name: Veille automatique (sans IA)

# Chaque jour à 17 h 15 (Paris) avant les agents 1, 2, 4 et 13 : collecte RSS / GDELT / Google Trends / Wikipédia /
# Reddit / TikTok Creative Center, puis corrélation (Sentence-Transformers) → state/veille_brute.json
on:
  schedule:
    - cron: "15 15 * * *"
    - cron: "40 2 * * *"     # 3 h 40 : juste avant la production de 4 h 50
    - cron: "15 5 * * *"     # 7 h 15 : avant les productions du matin
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1
      - run: pip install feedparser requests scikit-learn sentence-transformers --extra-index-url https://download.pytorch.org/whl/cpu
      - run: set -o pipefail; python -m pipeline.veille_brute 2>&1 | tail -40 | tee state/veille_log.txt
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add -A state/
          git diff --cached --quiet || (git commit -m "état : veille automatique" && for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; sleep $((i*4)); done)
