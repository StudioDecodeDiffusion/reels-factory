name: Archive publique (une fois)

on:
  workflow_dispatch:

jobs:
  copier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
        run: python -m pipeline.github_flow archive_publique
