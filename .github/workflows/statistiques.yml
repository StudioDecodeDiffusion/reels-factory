name: Statistiques et commentaires Instagram

# Chaque jour vers 16 h (Paris), avant les rapports des agents 8 (16 h 30) et 3 (17 h) :
# statistiques des vidéos, abonnés, nouveaux commentaires.
on:
  schedule:
    - cron: "5 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lire Instagram (les comptes sans token sont ignorés)
        env:
          IG_TOKEN_ACTU: ${{ secrets.IG_TOKEN_ACTU }}
          IG_TOKEN_ECO: ${{ secrets.IG_TOKEN_ECO }}
          IG_TOKEN_QHSE_VEILLE: ${{ secrets.IG_TOKEN_QHSE_VEILLE }}
          IG_TOKEN_QHSE_COURS: ${{ secrets.IG_TOKEN_QHSE_COURS }}
          IG_TOKEN_QHSE_ACTU: ${{ secrets.IG_TOKEN_QHSE_ACTU }}
          IG_TOKEN_SCIENCE: ${{ secrets.IG_TOKEN_SCIENCE }}
          IG_TOKEN_FUN: ${{ secrets.IG_TOKEN_FUN }}
        run: python -m pipeline.github_flow stats
      - name: Sauvegarder la mémoire
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "état : statistiques" && for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*4)); done)
