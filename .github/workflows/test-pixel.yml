name: Test des objets pixel art générés

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - continue-on-error: true
        run: |
          mkdir -p video/public/photos
          python - > video/public/photos/log.txt 2>&1 <<'PY'
          from pipeline.render import _generer_pixel
          for i, p in enumerate(["a frozen pension envelope in a block of ice", "an old french couple counting coins", "a government bank vault full of gold"]):
              print(p, "->", _generer_pixel(p, 1000 + i))
          PY
      - run: |
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git checkout -b test-pixel
          git add -f video/public/photos/
          git commit -m "test pixel" && git push -f origin test-pixel
