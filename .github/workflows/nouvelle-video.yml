name: Nouvelle vidéo → e-mail de validation

# Déclenché quand la session Claude de nuit dépose une vidéo : elle pousse les fichiers sur la branche
# « depot-videos » puis met à jour state/dernier_depot.json sur main, ce qui lance ce workflow.
on:
  push:
    branches: [main]
    paths: [state/dernier_depot.json]
  workflow_dispatch:

# Un seul traitement à la fois (le suivant attend son tour) : pas de fiche en double.
concurrency:
  group: depot-videos
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fiche:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: depot-videos
          path: _depot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Installer le moteur vidéo et les voix
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q -r requirements.txt piper-tts kokoro-onnx soundfile
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
          cd video && npm ci --no-audit --no-fund && npx remotion browser ensure
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/decode-voix
            ~/.cache/huggingface
          key: voix-v2
      - name: Voix off, rendu final, hébergement et fiche de validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
        run: python -m pipeline.github_flow on-drop _depot/drop
      - name: Sauvegarder la mémoire
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "état : nouvelle fiche" && for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*4)); done)
