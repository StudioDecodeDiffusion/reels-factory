name: Journal quotidien (un seul mail par jour)

on:
  schedule:
    - cron: "40 18 * * *"     # 20 h 40 heure de Paris (été) / 19 h 40 (hiver)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Envoyer le journal
        env:
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS || secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m pipeline.github_flow digest
      - name: Sauvegarder la mémoire
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "état : journal" && for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; sleep 5; done)
