name: Ma réponse (OK / NON / REP)

# Déclenché quand tu réponds à l'e-mail de validation (GitHub transforme ta réponse en commentaire).
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  reponse:
    # Seul le propriétaire du dépôt peut valider ; les commentaires du robot sont ignorés.
    if: github.event.comment.user.login == github.repository_owner && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Appliquer ma réponse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          IG_TOKEN_ACTU: ${{ secrets.IG_TOKEN_ACTU }}
          IG_TOKEN_QHSE: ${{ secrets.IG_TOKEN_QHSE }}
          IG_TOKEN_SCIENCE: ${{ secrets.IG_TOKEN_SCIENCE }}
          IG_TOKEN_FUN: ${{ secrets.IG_TOKEN_FUN }}
        run: python -m pipeline.github_flow on-comment
      - name: Sauvegarder la mémoire
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "état : réponse du propriétaire" && for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*4)); done)
