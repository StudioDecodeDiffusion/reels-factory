name: Facteur (tes mails) + publication

# Toutes les 30 min de 7 h à 23 h (Paris) : lit tes mails (OK / NON / REP / « agent N - note »),
# publie à l'heure prévue ce qui est validé, abandonne ce qui attend depuis plus de 36 h.
on:
  schedule:
    - cron: "*/30 5-21 * * *"
  workflow_dispatch:
  push:                                   # « publie maintenant » demandé par une session
    paths: ["state/publier_maintenant.json"]

concurrency:
  group: courrier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  facteur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Lire les mails et publier
        env:
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS || secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          IG_TOKEN_ACTU: ${{ secrets.IG_TOKEN_ACTU }}
          IG_TOKEN_ECO: ${{ secrets.IG_TOKEN_ECO }}
          IG_TOKEN_QHSE: ${{ secrets.IG_TOKEN_QHSE }}
          IG_TOKEN_SCIENCE: ${{ secrets.IG_TOKEN_SCIENCE }}
          IG_TOKEN_FUN: ${{ secrets.IG_TOKEN_FUN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python -m pipeline.github_flow facteur
      - name: Sauvegarder la mémoire
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/ suivi/
          git diff --cached --quiet || (git commit -m "état : facteur" && for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; sleep $((i*4)); done)
