name: Rappel renouvellement du token GitHub

# Le token GH_PAT expire le date indiquée ci-dessous (90 jours).
# Une semaine avant, une fiche est créée → tu reçois un e-mail.
# Après l'avoir renouvelé, mets à jour la date EXPIRATION ci-dessous (ou demande à Claude).
on:
  schedule:
    - cron: "0 8 * * 1"   # chaque lundi
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPIRATION: "2027-01-15"

jobs:
  rappel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Vérifier la date et prévenir par mail
        env:
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from pipeline import mail
          exp = date.fromisoformat(os.environ["EXPIRATION"])
          jours = (exp - date.today()).days
          print(f"Le token GH_PAT expire dans {jours} jours")
          if jours <= 7:
              mail.envoyer(8, f"Renouvelle le token GitHub (expire le {exp:%d/%m/%y})",
                  "<p>Le token <b>GH_PAT</b> expire dans <b>%d jours</b>. Sans lui, plus aucune vidéo ne peut être publiée.</p>"
                  "<ol><li>GitHub → Settings → Developer settings → Fine-grained tokens → <b>reels</b> → <b>Regenerate token</b> → 90 days.</li>"
                  "<li>Dépôts <b>reels-factory</b> ET <b>reels-media</b> → Settings → Secrets and variables → Actions → <code>GH_PAT</code> → <b>Update</b>.</li>"
                  "<li>Demande à Claude de mettre à jour la date d'expiration.</li></ol>" % jours,
                  "Pas besoin de répondre : ce rappel revient chaque lundi tant que la date n'est pas mise à jour.")
          PY
