name: Test recherche d'images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow requests pyyaml
      - run: |
          python - <<'PY' > state/test_images.txt 2>&1
          import re, html, urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept-Language": "fr-FR,fr;q=0.9"}
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40)
              return r.status, r.read().decode("utf-8", "ignore")
          q = "Microduck robot canard Disney"
          for nom, url in [("bing", "https://www.bing.com/images/search?q=" + urllib.parse.quote(q)),
                           ("bing-async", "https://www.bing.com/images/async?q=" + urllib.parse.quote(q) + "&first=1&count=20&mmasync=1"),
                           ("ddg-html", "https://duckduckgo.com/?q=" + urllib.parse.quote(q) + "&iax=images&ia=images")]:
              try:
                  st, page = get(url)
                  pg = html.unescape(page)
                  print(nom, st, len(page), "murl:", len(re.findall(r'"murl":"https?://', pg)), "vqd:", bool(re.search(r"vqd=", pg)), "titre:", (re.search(r"<title>(.*?)</title>", page, re.S) or [None, ""])[1][:80])
                  print("   ", pg[:200].replace("\n", " "))
              except Exception as e:
                  print(nom, "ERREUR", str(e)[:150])
          PY
      - run: |
          git config user.name "studio"; git config user.email "studio@users.noreply.github.com"
          git add state/test_images.txt; git commit -m "test images" ; git pull --rebase -X theirs origin main; git push
