name: 3. Gestion des comptes (stats + commentaires)

on:
  schedule:
    - cron: "5 17 * * *"   # chaque soir vers 19h (Paris, été)
  workflow_dispatch:

concurrency:
  group: state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Agent community manager (les comptes sans token sont ignorés)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_TOKEN_ACTU: ${{ secrets.IG_TOKEN_ACTU }}
          IG_TOKEN_SCIENCE: ${{ secrets.IG_TOKEN_SCIENCE }}
          IG_TOKEN_FUN: ${{ secrets.IG_TOKEN_FUN }}
        run: |
          for p in actu science fun; do
            python -m pipeline.run community --profile $p || echo "⚠️ $p en échec, on continue"
          done
      - name: Sauvegarder la mémoire
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "état : stats et commentaires" && git pull --rebase && git push)
