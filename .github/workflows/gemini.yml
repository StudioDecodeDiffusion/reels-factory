name: Gemini · brouillons de concept et de scénario

# Offre gratuite Google AI Studio (aucune facturation) : prépare les brouillons avant chaque session de production Claude.
on:
  schedule:
    - cron: "30 2 * * *"    # 4 h 30 Paris (éco, QSE)
    - cron: "30 8 * * *"    # 10 h 30 (actu 14 h)
    - cron: "30 12 * * *"   # 14 h 30 (actu 18 h)
    - cron: "0 14 * * *"    # 16 h 00 (science 20 h)
  workflow_dispatch:
    inputs:
      action: {description: "test ou preparer", required: true, default: "test"}

permissions:
  contents: write

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python -m pipeline.gemini ${{ inputs.action == 'test' && 'test' || 'preparer' }} 2>&1 | tee state/gemini_log.txt
      - if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add -A state/
          git diff --cached --quiet || (git commit -m "état : brouillons Gemini" && for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; sleep $((i*4)); done)
