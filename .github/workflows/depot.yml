name: Dépôt de la session Claude → mails (et rendu)

# La session Claude dépose ses travaux sur la branche « depot-videos » et met à jour
# state/dernier_depot.json sur main, ce qui lance ce workflow (léger) :
# rapports et concepts → mails ; vidéos → rendu final dans le dépôt PUBLIC reels-media (minutes illimitées).
on:
  push:
    branches: [main]
    paths: [state/dernier_depot.json]
  workflow_dispatch:

concurrency:
  group: courrier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  depot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: depot-videos
          path: _depot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Envoyer les mails / lancer le rendu
        env:
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS || secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          IG_TOKEN_ACTU: ${{ secrets.IG_TOKEN_ACTU }}
          IG_TOKEN_ECO: ${{ secrets.IG_TOKEN_ECO }}
          IG_TOKEN_SCIENCE: ${{ secrets.IG_TOKEN_SCIENCE }}
          IG_TOKEN_FUN: ${{ secrets.IG_TOKEN_FUN }}
          IG_TOKEN_QHSE_VEILLE: ${{ secrets.IG_TOKEN_QHSE_VEILLE }}
          IG_TOKEN_QHSE_COURS: ${{ secrets.IG_TOKEN_QHSE_COURS }}
          IG_TOKEN_QHSE_ACTU: ${{ secrets.IG_TOKEN_QHSE_ACTU }}
          RENDU_PUBLIC: "1"
        run: python -m pipeline.github_flow depot _depot/drop
      - name: Sauvegarder la mémoire
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "état : courrier" && for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*4)); done)
