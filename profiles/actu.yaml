# Compte : actualité expliquée en animation
id: actu
nom_compte: "Décodé · Actu"
instagram: "@decode.actu"
instagram_secret: IG_TOKEN_ACTU         # nom du secret GitHub contenant le token Instagram de ce compte
langue: fr
public: "18-35 ans francophones, curieux, peu de temps, veulent comprendre l'actu sans jargon"
ton: "clair, neutre, factuel, jamais militant ; une pointe d'humour seulement sur les sujets légers"
niche: "expliquer UNE info d'actualité du jour en 45-60 s avec chiffres et schémas animés"

veille:
  actualite: true
  pays: FR
  thematiques: ["économie", "tech", "science", "international", "société", "climat", "consommation"]
  exclusions:                          # sujets à ne jamais traiter
    - "faits divers violents, attentats, décès de personnes privées"
    - "rumeurs non confirmées"
    - "prises de position partisanes"
  sources_preferees: ["lemonde.fr", "francetvinfo.fr", "afp.com", "reuters.com", "insee.fr", "lesechos.fr", "service-public.fr"]

video:
  duree_cible_s: 50
  scenes_autorisees: [hook, kinetic, counter, bars, timeline, dots, compare, outro]
  cta: "Abonne-toi pour l'actu décodée chaque soir"

voix:                                   # voix off IA gratuite, générée dans GitHub Actions
  active: true
  narrateur: "piper:fr_FR-upmc-medium?spk=1&vitesse=1.05&expr=0.85&rythme=1.0"   # Lou (à gauche) — à confirmer
  mascotte: "piper:fr_FR-upmc-medium?spk=0&vitesse=1.05&expr=0.85&rythme=1.0"    # Déco (à droite) — à confirmer
  mascotte_effet: "aigu"                # Déco un peu plus aiguë pour bien distinguer les deux voix
  vitesse: 1.0

planning:
  generation: "chaque nuit à 00:20"     # tâche planifiée Claude (heure de Paris)
  publication_jours: [1, 2, 3, 4, 5, 6, 7]   # 1 = lundi … 7 = dimanche
  publication_heure: 18                 # heure de Paris : la vidéo validée part entre 18h25 et 18h35
  hashtags_max: 5

mention_ia: "Animation créée avec l'IA."

charte_initiale:                        # point de départ, l'agent directeur artistique peut l'affiner
  nom: "Dépêche"
  fond: "#0E1116"
  texte: "#F4F1EA"
  accent: "#FF5A36"
  accent2: "#3FA7FF"
  style: "pixel"                       # pixel art coloré et animé, mascotte, sous-titres mot à mot
  tenues: {narrateur: "economie", mascotte: "classique"}   # tenues de base (voir video/src/personnages.ts)
  palette: ['#FFD23F', '#3D5AFE', '#FF4F81', '#2EC4B6', '#1B1F3B', '#FF8A1F']
  police_titre: "Rubik"
  police_texte: "Rubik"
  signature: "bandeau rouge en haut avec la date du jour"
