# Compte 1 : actualité française, ligne sociale / revendications populaires
id: actu
numero: 1                       # n° de compte : sous-agents « Agent N.1 »
nom_compte: "Décodé · Actu"
instagram: "@decodeactu"
instagram_secret: IG_TOKEN_ACTU         # nom du secret GitHub contenant le token Instagram de ce compte
langue: fr
public: "18-35 ans francophones, curieux, peu de temps, veulent comprendre l'actu sans jargon"
ton: "clair, engagé côté social, du point de vue des gens concernés (salariés, jeunes, précaires) ; factuel et sourcé ; humour sur les sujets légers"
ligne_editoriale: "plutôt à gauche : pouvoir d'achat, salaires, services publics, mobilisations et revendications populaires, inégalités ; on donne la parole aux concernés"
niche: "expliquer UNE info d'actualité du jour en 45-60 s avec chiffres et schémas animés"

veille:
  actualite: true
  pays: FR
  thematiques: ["économie", "tech", "science", "international", "société", "climat", "consommation"]
  exclusions:                          # sujets à ne jamais traiter
    - "faits divers violents, attentats, décès de personnes privées"
    - "rumeurs non confirmées"
    - "désinformation : l'angle est assumé, mais les faits restent exacts et sourcés, jamais déformés"
    - "attaques personnelles, appels à la violence"
  sources_preferees: ["lemonde.fr", "francetvinfo.fr", "afp.com", "reuters.com", "insee.fr", "lesechos.fr", "service-public.fr"]

video:
  duree_cible_s: 50
  scenes_autorisees: [hook, kinetic, counter, bars, timeline, dots, compare, outro, quiz, bigstat, checklist, pancartes, sms, debat, reaction, conte, photo, pendant]
  cta: "Abonne-toi pour l'actu décodée chaque soir"

voix:                                   # voix off IA gratuite, générée dans GitHub Actions
  active: true
  # Voix retenues (voir voix/echantillons) :
  #   chatterbox standard (femme, naturelle) : "chatterbox:fr?exag=0.6&cfg=0.4"
  #   Jessica (femme, claire et posée)       : "piper:fr_FR-upmc-medium?spk=0&vitesse=1.05&expr=0.85&rythme=1.0"
  #   Pierre Chatterbox (homme, très expressif) : "chatterbox:fr?ref=pierre&exag=0.6&cfg=0.3"
  narrateur: "chatterbox:fr?exag=0.6&cfg=0.4"            # Lou (à gauche)
  mascotte: "chatterbox:fr?ref=pierre&exag=0.6&cfg=0.3"  # Déco (à droite) = Pierre Chatterbox…
  mascotte_effet: "aigu"                                 # … avec l'effet aigu
  vitesse: 1.0

planning:
  generation: "chaque nuit à 00:20"     # tâche planifiée Claude (heure de Paris)
  publication_jours: [1, 2, 3, 4, 5, 6, 7]   # 1 = lundi … 7 = dimanche
  auto_publication: true               # sans réponse du propriétaire, publiée à son créneau
  creneaux: ["12:30", "18:30"]          # une vidéo par demi-journée
  publication_minute: 30                # test A/B de l'agent 3 : publication à 18 h 30
  publication_heure: 18                 # heure de Paris : la vidéo validée part entre 18h25 et 18h35
  hashtags_max: 5

mention_ia: "Animation créée avec l'IA."

charte_initiale:                        # point de départ, l'agent directeur artistique peut l'affiner
  nom: "Dépêche"
  fond: "#0E1116"
  texte: "#F4F1EA"
  accent: "#FF5A36"
  accent2: "#3FA7FF"
  style: "pixel"                       # pixel art coloré et animé, mascotte, sous-titres mot à mot
  tenues: {narrateur: "economie", mascotte: "classique"}   # tenues de base (voir video/src/personnages.ts)
  palette: ['#FFD23F', '#3D5AFE', '#FF4F81', '#2EC4B6', '#1B1F3B', '#FF8A1F']
  police_titre: "Rubik"
  police_texte: "Rubik"
  signature: "bandeau rouge en haut avec la date du jour"
musique: "curieux"            # ambiance par défaut si l'agent 6 n'en choisit pas

sous_agents:
  1: Actu du jour qui touche le quotidien et les revendications populaires (prix, salaires, mobilisations).
  2: Tendances des comptes d'actu engagés côté social, mèmes de mobilisation.
  4: Choisir l'angle « ce que ça change pour les gens » ; donner la parole aux concernés.
  5: Ton direct et proche ; Lou porte la question des gens, Déco les faits.
  6: Couleurs vives et chaudes ; tenues du quotidien ; musique selon l'ambiance et les trends.
  9: Vérifier que l'angle militant ne déforme aucun fait ; projection sur les 18-35 sensibles au social.
