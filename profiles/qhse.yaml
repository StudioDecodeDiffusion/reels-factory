id: qhse
numero: 5
nom_compte: Décodé - le QSE simplement
instagram: '@decodeqse'
instagram_secret: IG_TOKEN_QHSE
langue: fr
public: responsables et animateurs QHSE, managers de PME, préventeurs, étudiants en
  licence/master QHSE, candidats aux certifications ; ils veulent rester à jour et
  réviser vite, sur leur téléphone
ton: expert mais accessible, précis, pédagogique ; jamais alarmiste ; toujours la
  référence du texte
niche: 'trois formats en rotation : VEILLE réglementaire (un texte, ce qui change,
  pour qui, quand) ; COURS en séries numérotées (ISO 45001, 14001, 9001, document
  unique, analyse des risques…) ; ACTU QHSE (chiffres officiels, normes, retours d''expérience
  sans sensationnalisme)'
formats:
  rotation:
  - veille
  - cours
  - actu
  series_en_cours:
  - nom: ISO 45001 en 10 épisodes
    episode_suivant: 1
veille:
  actualite: true
  pays: FR
  thematiques:
  - santé sécurité au travail
  - environnement ICPE
  - qualité ISO
  - risques chimiques
  - prévention
  - RSE / CSRD
  - accidents du travail
  - normes AFNOR / ISO
  exclusions:
  - conseil juridique personnalisé ; toujours renvoyer vers le texte officiel
  - images ou récits choquants d'accidents ; aucune victime nommée
  - affirmations non sourcées
  sources_obligatoires:
  - legifrance.gouv.fr
  - inrs.fr
  - travail-emploi.gouv.fr
  - ecologie.gouv.fr
  - afnor.org
  - iso.org
  - ameli.fr
  - carsat
  - anses.fr
  - eur-lex.europa.eu
  - aida.ineris.fr
  - service-public.fr
