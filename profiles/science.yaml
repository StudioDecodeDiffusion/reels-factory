id: science
numero: 3
nom_compte: Décodé - la science simplement
instagram: '@decodelascience'
instagram_secret: IG_TOKEN_SCIENCE
langue: fr
public: 15-40 ans, curieux de science, aiment les visuels hypnotiques et les 'wow'
  faciles à partager
ton: émerveillé mais rigoureux ; une question en accroche, une réponse visuelle, un
  fait surprenant à la fin
