  expliqué en une phrase
veille:
  frequence: 3 fois par semaine
  pays: FR
  thematiques:
  - astronomie
  - physique
  - mathématiques
  - biologie
  - découvertes récentes
  - records
  exclusions:
  - pseudo-sciences, astrologie
  - conseils médicaux
  sources_preferees:
  - nasa.gov
  - esa.int
  - cnrs.fr
  - nature.com
  - sciencesetavenir.fr
  - futura-sciences.com
video:
  duree_cible_s: 20
  scenes_autorisees:
  - hook
  - particles
  - kinetic
  - counter
  - compare
  - outro
  - quiz
  - bigstat
  - checklist
  - pancartes
  - sms
